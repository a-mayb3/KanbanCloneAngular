<article class="collaborator-item">
  <div class="collaborator-avatar">
    {{ user.name?.slice(0, 1) || '?' }}
  </div>
  <div class="collaborator-info">
    <h4>{{ user.name }}</h4>
    <p>{{ user.email }}</p>
  </div>
  <button class="btn-remove" type="button" aria-label="Remove collaborator" (click)="onRemove()">
    x
  </button>
</article>
